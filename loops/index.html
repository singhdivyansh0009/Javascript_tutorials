<!DOCTYPE html>
<html>
<head>
   <title>Card</title>
   <style>
       .container {
           display: flex;
           flex-wrap: wrap;
           width: 100%;
           height: 100%;
           justify-content: center;
           align-items: center;
           background-color: burlywood;
       }
       .card {
           display: flex;
           flex-direction: column;
           width: 200px; 
           height: 300px; 
           justify-content: center;
           align-items: center;
           border: 2px solid;
           margin: 20px;
           padding: 10px;
           box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
           background-color: white;
           text-align: center;
       }
       .card img {
           max-width: 100%;
           height: auto;
       }
   </style>
</head>
<body>
    <div class="container"></div>
    <script src="script.js"></script>
</body>
</html>
